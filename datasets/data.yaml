# 不設定 path：Ultralytics 會以這個 yaml 所在資料夾為根目錄
# 請把 Roboflow 匯出的 train/ 與 valid/ 放在 datasets/ 底下
train: train/images
val: valid/images

# 3. 類別設定 (維持原樣)
nc: 3
names: ['black_smoky', 'chimney', 'white_smoky']

# 下面 Roboflow 的資訊留著沒關係，不影響訓練
roboflow:
  workspace: justins-workspace-3mnwz
  project: chimney-l1vf2-wvsig
  version: 1
  license: CC BY 4.0
  url: https://universe.roboflow.com/justins-workspace-3mnwz/chimney-l1vf2-wvsig/dataset/1